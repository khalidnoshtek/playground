name: Build debug APK

on:
  push:
    branches: [main, "claude/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-34 build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.7

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SecureSmsLink-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # Optional: upload to Firebase App Distribution if secrets are configured.
      # Required repo secrets:
      #   FIREBASE_APP_ID         — e.g. 1:1234567890:android:abcdef
      #   FIREBASE_SERVICE_ACCOUNT — full JSON of a service account with
      #                              "Firebase App Distribution Admin" role
      - name: Distribute to Firebase testers
        if: ${{ env.FIREBASE_APP_ID != '' && env.FIREBASE_SA != '' }}
        env:
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          echo "$FIREBASE_SA" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          npm install -g firebase-tools
          firebase appdistribution:distribute \
            app/build/outputs/apk/debug/app-debug.apk \
            --app "$FIREBASE_APP_ID" \
            --testers "xdrkzx@gmail.com" \
            --release-notes "Build ${{ github.sha }} on ${{ github.ref_name }}"
